# Supabase API gateway routes for the wacrm Railway template.
#
# Derived from supabase/supabase docker/volumes/api/kong.yml, trimmed to what wacrm uses:
# auth, REST, GraphQL, Realtime and Storage. Studio, pg-meta, Edge Functions, analytics and the
# dashboard basic-auth consumer are removed -- none of those services exist in this template, and a
# route to a service that is not there is an open door waiting for someone to add one.
#
# Upstream hostnames (auth:9999, rest:3000 ...) are replaced by $AUTH_HOST, $REST_HOST,
# $REALTIME_HOST and $STORAGE_HOST, which the entrypoint fills from the environment, because on
# Railway the services answer at <name>.railway.internal.

_format_version: '2.1'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1-open
    url: http://$AUTH_HOST:9999/verify
    routes: [{ name: auth-v1-open, strip_path: true, paths: [/auth/v1/verify] }]
    plugins: [{ name: cors }]
  - name: auth-v1-open-callback
    url: http://$AUTH_HOST:9999/callback
    routes: [{ name: auth-v1-open-callback, strip_path: true, paths: [/auth/v1/callback] }]
    plugins: [{ name: cors }]
  - name: auth-v1-open-authorize
    url: http://$AUTH_HOST:9999/authorize
    routes: [{ name: auth-v1-open-authorize, strip_path: true, paths: [/auth/v1/authorize] }]
    plugins: [{ name: cors }]
  - name: auth-v1-open-jwks
    url: http://$AUTH_HOST:9999/.well-known/jwks.json
    routes: [{ name: auth-v1-open-jwks, strip_path: true, paths: [/auth/v1/.well-known/jwks.json] }]
    plugins: [{ name: cors }]

  - name: auth-v1
    url: http://$AUTH_HOST:9999/
    routes: [{ name: auth-v1-all, strip_path: true, paths: [/auth/v1/] }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: request-transformer
        config:
          add: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
          replace: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }

  - name: rest-v1-openapi
    url: http://$REST_HOST:3000/
    routes: [{ name: rest-v1-openapi-root, strip_path: true, expression: 'http.path == "/rest/v1/"' }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: request-transformer
        config:
          add: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
          replace: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
      - name: acl
        config: { hide_groups_header: true, allow: [admin] }

  - name: rest-v1
    url: http://$REST_HOST:3000/
    routes: [{ name: rest-v1-all, strip_path: true, paths: [/rest/v1/] }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: request-transformer
        config:
          add: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
          replace: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }

  - name: graphql-v1
    url: http://$REST_HOST:3000/rpc/graphql
    routes: [{ name: graphql-v1-all, strip_path: true, paths: [/graphql/v1] }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: request-transformer
        config:
          add: { headers: ["Content-Profile: graphql_public", "Authorization: $LUA_AUTH_EXPR"] }
          replace: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }

  - name: realtime-v1-ws
    url: http://$REALTIME_HOST:4000/socket
    protocol: ws
    routes: [{ name: realtime-v1-ws, strip_path: true, paths: [/realtime/v1/] }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: request-transformer
        config:
          add: { headers: ["x-api-key:$LUA_RT_WS_EXPR"] }
          replace: { querystring: ["apikey:$LUA_RT_WS_EXPR"] }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }

  - name: realtime-v1-rest-openapi
    url: http://$REALTIME_HOST:4000/api/openapi
    protocol: http
    routes: [{ name: realtime-v1-rest-openapi, strip_path: true, paths: [/realtime/v1/api/openapi] }]
    plugins:
      - name: request-termination
        config: { status_code: 403, message: "Access is forbidden." }

  - name: realtime-v1-rest-tenants
    url: http://$REALTIME_HOST:4000/api/tenants
    protocol: http
    routes: [{ name: realtime-v1-rest-tenants, strip_path: true, paths: [/realtime/v1/api/tenants] }]
    plugins:
      - name: request-termination
        config: { status_code: 403, message: "Access is forbidden." }

  - name: realtime-v1-rest
    url: http://$REALTIME_HOST:4000/api
    protocol: http
    routes: [{ name: realtime-v1-rest, strip_path: true, paths: [/realtime/v1/api] }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: request-transformer
        config:
          add: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
          replace: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }

  - name: storage-v1
    url: http://$STORAGE_HOST:5000/
    routes: [{ name: storage-v1-all, strip_path: true, paths: [/storage/v1/] }]
    plugins:
      - name: cors
      - name: request-transformer
        config:
          add: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
          replace: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
      - name: post-function
        config:
          access:
            - |
              local auth = kong.request.get_header("authorization")
              if auth == nil or auth == "" or auth:find("^%s*$") then
                kong.service.request.clear_header("authorization")
              end
