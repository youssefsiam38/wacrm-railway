name: publish-image

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  COMPONENTS: db kong storage app scheduler

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Static checks
        run: tests/static.sh

      - name: Resolve wrapper version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Every wrapper is built once, as a local candidate, and the whole bundle is tested with those
      # exact images. The images pushed afterwards are the tested ones, retagged, not a rebuild.
      # amd64 only: the app is built from source here and Railway runs amd64.
      - name: Build candidates
        env:
          WRAPPER_VERSION: ${{ steps.ver.outputs.version }}
          VCS_REF: ${{ github.sha }}
          WACRM_RAILWAY_DB_IMAGE: wacrm-railway-db:candidate
          WACRM_RAILWAY_KONG_IMAGE: wacrm-railway-kong:candidate
          WACRM_RAILWAY_STORAGE_IMAGE: wacrm-railway-storage:candidate
          WACRM_RAILWAY_APP_IMAGE: wacrm-railway-app:candidate
          WACRM_RAILWAY_SCHEDULER_IMAGE: wacrm-railway-scheduler:candidate
        run: docker compose build --pull

      - name: Smoke tests against candidates
        env:
          WACRM_RAILWAY_DB_IMAGE: wacrm-railway-db:candidate
          WACRM_RAILWAY_KONG_IMAGE: wacrm-railway-kong:candidate
          WACRM_RAILWAY_STORAGE_IMAGE: wacrm-railway-storage:candidate
          WACRM_RAILWAY_APP_IMAGE: wacrm-railway-app:candidate
          WACRM_RAILWAY_SCHEDULER_IMAGE: wacrm-railway-scheduler:candidate
        run: tests/smoke.sh

      - name: Persistence tests against candidates
        env:
          WACRM_RAILWAY_DB_IMAGE: wacrm-railway-db:candidate
          WACRM_RAILWAY_KONG_IMAGE: wacrm-railway-kong:candidate
          WACRM_RAILWAY_STORAGE_IMAGE: wacrm-railway-storage:candidate
          WACRM_RAILWAY_APP_IMAGE: wacrm-railway-app:candidate
          WACRM_RAILWAY_SCHEDULER_IMAGE: wacrm-railway-scheduler:candidate
        run: tests/persistence.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 || true

      - name: Tear down test stack
        if: always()
        run: docker compose down -v --remove-orphans || true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested images
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          tags=("$VERSION")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tags+=("${VERSION%.*}" latest); fi
          {
            echo "### Published images"
            echo
            echo "| Component | Reference |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for c in $COMPONENTS; do
            for t in "${tags[@]}"; do
              docker tag "wacrm-railway-$c:candidate" "$IMAGE_PREFIX-$c:$t"
              docker push -q "$IMAGE_PREFIX-$c:$t"
            done
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_PREFIX-$c:$VERSION")
            echo "| $c | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done
